# Cloudflare Workers 部署設定
#
# 【這個檔案是什麼】
#   Cloudflare 的部署說明書。`wrangler deploy` 會讀它來決定：
#   進入點在哪、要上傳哪些靜態檔、需要哪些相容性設定。
#
# 【為什麼需要 nodejs_compat】
#   server/core.ts 用了 `node:crypto` 的 createHash（算圖片快取鍵）與 `process.env`
#   （讀 API 金鑰）。Workers 預設沒有 Node 模組，開啟這個旗標才會提供。

# ⚠️ Worker 名稱會直接變成網址的第一段：<name>.<子網域>.workers.dev
#    取名 "app" 而不是 "labelbuddy-ai"，是為了讓網址好唸好寫：
#      app.labelbuddy-ai.workers.dev      ← 現在
#      labelbuddy-ai.labelbuddy-ai.workers.dev  ← 舊的（兩段同名，看起來像跳針）
#    改名字等於建一個新的 Worker，**Secret 不會跟著搬**，要重新設定一次。
name = "app"
main = "worker.ts"

# 相容性日期：決定 Workers 執行環境的行為版本。用建立當天即可。
compatibility_date = "2026-09-27"
compatibility_flags = ["nodejs_compat"]

# ── 靜態資源（前端 build 產物）────────────────────────────────────
# vite build 會把 public/ 一起複製到 dist/，所以語言檔與 WASM 引擎都在裡面。
[assets]
directory = "./dist"
binding = "ASSETS"

# 找不到檔案時回 index.html，讓前端路由（SPA）能運作
not_found_handling = "single-page-application"

# ⚠️ 這一行是關鍵：強制 /api/* 先交給 Worker 處理。
#    沒有的話，SPA 模式會讓所有找不到靜態檔的路徑（包含 /api/analyze-label）
#    都回 index.html，API 會整組壞掉。
run_worker_first = ["/api/*"]

# ── 可觀測性 ────────────────────────────────────────────────────
# 打開即時日誌，部署後可以在 Cloudflare 後台看到 console.log 輸出。
# 除錯 AI 供應商失敗、冷卻、快取命中時很有用。
[observability]
enabled = true

# ── 環境變數 ────────────────────────────────────────────────────
# ⚠️ 不要把 API 金鑰寫在這裡！這個檔案會進版控。
#    金鑰用 `wrangler secret put OPENROUTER_API_KEY` 設定（加密儲存）。
#    本機測試時放在 .dev.vars（已在 .gitignore）。
#
# 以下是非機密的預設值，可以安心放在版控裡。
[vars]
# 網址格式是 <Worker名稱>.<子網域>.workers.dev
#   Worker 名稱 = 上面的 name（app）
#   子網域     = 註冊 workers.dev 時選的（labelbuddy-ai）
APP_URL = "https://app.labelbuddy-ai.workers.dev"
AI_REQUEST_TIMEOUT_MS = "45000"
AI_CACHE_TTL_MS = "86400000"

# ── KV：線上題庫（2026-10-07 第二階段）──────────────────────────────
#
# 【這個 namespace 存什麼】
#   AI 生成的「學一個小知識」題目。存下來之後，**同一題不必再花額度生成一次**，
#   而且換一台手機也看得到（跨裝置）。
#
# 【key 設計】
#   q:<id>      單題 JSON（含英文版）
#   bank:index  { version, ids[], updatedAt }
#
# 【⚠️ 為什麼可以安全地降級】
#   `env.QUIZ_BANK` 若不存在（例如本機 `node server.ts`、或這個 binding 被拿掉），
#   後端就不注入 `deps.quizBank` → 走「無題庫」分支：
#   仍然能用 AI 生成題目，只是**不寫入也不查詢**。
#   功能不會壞，只失去線上題庫。這是刻意的設計（見 server/quizBank.ts）。
#
# 【id 怎麼來的】
#   `wrangler kv namespace create QUIZ_BANK`（2026-10-07 建立）。
#   ⚠️ id 不是機密，可以進版控；但**改 id 等於換一個空題庫**。
[[kv_namespaces]]
binding = "QUIZ_BANK"
id = "6f4cf68e962f4dae9d1e1e1beb85dd28"
